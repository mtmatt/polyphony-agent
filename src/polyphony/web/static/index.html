<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Polyphony Agent Dashboard</title>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3a;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --accent:   #7c3aed;
    --accent2:  #06b6d4;
    --success:  #22c55e;
    --warn:     #f59e0b;
    --error:    #ef4444;
    --running:  #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px; min-width: 220px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
  }
  #sidebar-header .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  #sidebar-header .version { font-size: 10px; color: var(--muted); margin-left: auto; }

  #search-box {
    margin: 10px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; outline: none; width: calc(100% - 20px);
  }
  #search-box:focus { border-color: var(--accent); }

  #run-list { flex: 1; overflow-y: auto; padding: 0 6px 6px; }
  .run-item {
    padding: 10px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 3px;
    border: 1px solid transparent; transition: background 0.15s;
  }
  .run-item:hover { background: var(--bg); }
  .run-item.active { background: var(--bg); border-color: var(--accent); }
  .run-item .run-goal { font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-item .run-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 10px; }
  .run-item .run-meta .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-success { background: var(--success); }
  .dot-error   { background: var(--error); }
  .dot-running { background: var(--running); animation: pulse 1.5s infinite; }
  .dot-unknown { background: var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  #sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }
  .btn-refresh {
    width: 100%; padding: 7px; background: var(--accent); border: none; border-radius: 6px;
    color: #fff; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  .btn-refresh:hover { opacity: .85; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #topbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .badge {
    padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase;
  }
  .badge-success { background: #14532d; color: var(--success); }
  .badge-error   { background: #450a0a; color: var(--error); }
  .badge-running { background: #1e3a5f; color: var(--running); }
  .badge-unknown { background: var(--border); color: var(--muted); }

  #live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  #live-dot.connected { background: var(--success); animation: pulse 2s infinite; }

  #content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }

  /* ── Stats row ── */
  #stats-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-card .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-card .stat-sub   { font-size: 10px; color: var(--muted); }

  /* ── Sections ── */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .section-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 8px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .section-header .count { background: var(--border); color: var(--text); padding: 1px 7px; border-radius: 10px; font-size: 10px; }
  .section-body { padding: 14px; }

  /* ── Task list ── */
  .task-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .task-row:last-child { border-bottom: none; }
  .task-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; margin-top: 1px; }
  .task-icon-done    { background: #14532d; color: var(--success); }
  .task-icon-error   { background: #450a0a; color: var(--error); }
  .task-icon-running { background: #1e3a5f; color: var(--running); }
  .task-icon-pending { background: var(--border); color: var(--muted); }
  .task-body { flex: 1; min-width: 0; }
  .task-id   { font-size: 10px; color: var(--muted); font-family: monospace; }
  .task-desc { font-size: 12px; margin-top: 2px; }
  .task-meta { display: flex; gap: 10px; margin-top: 4px; color: var(--muted); font-size: 10px; }
  .task-deps { font-size: 10px; color: var(--accent2); margin-top: 3px; }

  /* ── Dependency graph ── */
  #graph-canvas { width: 100%; overflow-x: auto; }
  .mermaid-fallback { font-family: monospace; font-size: 11px; color: var(--muted); white-space: pre; }

  /* ── Graph (SVG-based) ── */
  svg.dep-graph { display: block; }
  .node-rect { rx: 6; ry: 6; stroke-width: 1.5; }
  .node-text { font-size: 10px; fill: #e2e8f0; font-family: system-ui; pointer-events: none; }
  .edge-line { stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }

  /* ── Timeline ── */
  .timeline-row { display: flex; gap: 10px; padding: 6px 0; align-items: center; font-size: 11px; }
  .timeline-time { color: var(--muted); font-family: monospace; width: 85px; flex-shrink: 0; }
  .timeline-type { width: 60px; flex-shrink: 0; }
  .timeline-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Empty / loading ── */
  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 12px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Overview (home) ── */
  #overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { #overview-grid { grid-template-columns: 1fr; } }

  .recent-run-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .recent-run-row:hover { background: var(--bg); border-radius: 4px; padding-left: 6px; }
  .recent-run-row:last-child { border-bottom: none; }
  .recent-run-goal { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-run-ts   { font-size: 10px; color: var(--muted); flex-shrink: 0; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .bar-label { width: 90px; color: var(--muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
  .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 3px; background: var(--accent); }
  .bar-val   { width: 30px; text-align: right; color: var(--muted); }

  /* ── Progress bar ── */
  .progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .progress-fill  { height: 100%; background: var(--success); border-radius: 2px; transition: width .4s; }

  /* ── Tabs ── */
  .tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 16px; }
  .tab-btn { padding: 10px 14px; font-size: 12px; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<div id="sidebar">
  <div id="sidebar-header">
    <span class="logo">♩ Polyphony</span>
    <span class="version">v2</span>
  </div>
  <input id="search-box" type="text" placeholder="🔍  Search runs…"/>
  <div id="run-list"><div class="empty"><span class="spinner"></span></div></div>
  <div id="sidebar-footer">
    <button class="btn-refresh" onclick="loadRuns()">↻ Refresh</button>
  </div>
</div>

<!-- ═══ Main ═══ -->
<div id="main">
  <div id="topbar">
    <h1 id="topbar-title">Overview</h1>
    <span id="topbar-badge" class="badge badge-unknown" style="display:none"></span>
    <div id="live-dot" title="WebSocket"></div>
  </div>

  <div id="content">
    <div class="empty"><span class="spinner"></span></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let currentRunId = null;
let ws = null;
let allRuns = [];
let searchTimer = null;

// ─────────────────────────────────────────────
// Utility
// ─────────────────────────────────────────────
const fmt = {
  ts(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString();
  },
  dur(s) {
    if (!s) return '—';
    s = Math.round(s);
    if (s < 60)  return `${s}s`;
    if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
    return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
  },
  num(n) { return (n ?? 0).toLocaleString(); },
  pct(n) { return (n ?? 0).toFixed(1) + '%'; },
};

function statusDot(status) {
  const s = (status || '').toLowerCase();
  if (s === 'success' || s === 'completed') return 'dot-success';
  if (s === 'error'   || s === 'failed')    return 'dot-error';
  if (s === 'running' || s === 'in_progress') return 'dot-running';
  return 'dot-unknown';
}
function badgeClass(status) {
  const s = (status || '').toLowerCase();
  if (s === 'success' || s === 'completed') return 'badge-success';
  if (s === 'error'   || s === 'failed')    return 'badge-error';
  if (s === 'running' || s === 'in_progress') return 'badge-running';
  return 'badge-unknown';
}
function taskIcon(t) {
  if (t.completed && !t.error) return ['✓', 'task-icon-done'];
  if (t.error)                  return ['✕', 'task-icon-error'];
  if (t.in_progress)            return ['⟳', 'task-icon-running'];
  return                               ['·', 'task-icon-pending'];
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// API
// ─────────────────────────────────────────────
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

// ─────────────────────────────────────────────
// Sidebar
// ─────────────────────────────────────────────
async function loadRuns() {
  try {
    const data = await api('/api/runs?limit=200');
    allRuns = data.runs || [];
    renderRunList(allRuns);
    if (!currentRunId) showOverview();
  } catch(e) {
    document.getElementById('run-list').innerHTML = `<div class="empty">Failed to load runs</div>`;
  }
}

function renderRunList(runs) {
  const el = document.getElementById('run-list');
  if (!runs.length) { el.innerHTML = '<div class="empty">No runs found</div>'; return; }
  el.innerHTML = runs.map(r => `
    <div class="run-item${r.id === currentRunId ? ' active' : ''}" onclick="openRun('${esc(r.id)}')">
      <div class="run-goal">${esc(r.goal)}</div>
      <div class="run-meta">
        <span class="dot ${statusDot(r.status)}"></span>
        <span>${esc(r.status || 'unknown')}</span>
        <span>${r.completed_tasks ?? 0}/${r.total_tasks ?? 0} tasks</span>
      </div>
      <div class="progress-track" style="margin-top:5px">
        <div class="progress-fill" style="width:${Math.min(100, r.progress_percentage || 0)}%"></div>
      </div>
    </div>`).join('');
}

// Search
document.getElementById('search-box').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) { renderRunList(allRuns); return; }
  searchTimer = setTimeout(async () => {
    try {
      const data = await api(`/api/search?q=${encodeURIComponent(q)}&limit=50`);
      renderRunList((data.results || []).map(r => r.run));
    } catch { renderRunList(allRuns.filter(r => r.goal?.toLowerCase().includes(q.toLowerCase()))); }
  }, 300);
});

// ─────────────────────────────────────────────
// Overview (home)
// ─────────────────────────────────────────────
async function showOverview() {
  document.getElementById('topbar-title').textContent = 'Overview';
  document.getElementById('topbar-badge').style.display = 'none';
  currentRunId = null;
  closeWs();

  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty"><span class="spinner"></span></div>';

  try {
    const stats = await api('/api/stats');
    content.innerHTML = `
      <div id="stats-bar">
        ${statCard('Total Runs',    fmt.num(stats.total_runs),   '')}
        ${statCard('Successful',    fmt.num(stats.successful_runs), `${fmt.pct(stats.success_rate)} rate`, '#22c55e')}
        ${statCard('Failed',        fmt.num(stats.failed_runs),  '', '#ef4444')}
        ${statCard('In Progress',   fmt.num(stats.in_progress),  '', '#3b82f6')}
        ${statCard('Total Tasks',   fmt.num(stats.total_tasks),  '')}
      </div>

      <div id="overview-grid">
        <div class="section">
          <div class="section-header">Recent Runs</div>
          <div class="section-body" id="recent-runs-body">
            ${allRuns.slice(0, 12).map(r => `
              <div class="recent-run-row" onclick="openRun('${esc(r.id)}')">
                <span class="dot ${statusDot(r.status)}"></span>
                <span class="recent-run-goal">${esc(r.goal)}</span>
                <span class="recent-run-ts">${fmt.ts(r.timestamp).split(',')[0]}</span>
              </div>`).join('') || '<div class="empty">No runs</div>'}
          </div>
        </div>

        <div class="section">
          <div class="section-header">Models Used</div>
          <div class="section-body">
            ${renderModelBars(stats.models_used)}
          </div>
        </div>

        <div class="section" style="grid-column:1/-1">
          <div class="section-header">Activity (last 30 days)</div>
          <div class="section-body">
            ${renderDayChart(stats.goals_by_day)}
          </div>
        </div>
      </div>`;
  } catch(e) {
    content.innerHTML = `<div class="empty">Could not load stats: ${esc(e.message)}</div>`;
  }
}

function statCard(label, value, sub='', color='') {
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-value" ${color ? `style="color:${color}"` : ''}>${value}</div>
    ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
  </div>`;
}

function renderModelBars(models) {
  if (!models || !Object.keys(models).length) return '<div class="empty">No data</div>';
  const max = Math.max(...Object.values(models));
  return Object.entries(models).sort((a,b)=>b[1]-a[1]).map(([m,c]) => `
    <div class="bar-row">
      <span class="bar-label" title="${esc(m)}">${esc(m)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${max ? c/max*100 : 0}%"></div></div>
      <span class="bar-val">${fmt.num(c)}</span>
    </div>`).join('');
}

function renderDayChart(days) {
  if (!days || !Object.keys(days).length) return '<div class="empty">No activity data</div>';
  const entries = Object.entries(days).sort((a,b) => a[0] < b[0] ? -1 : 1).slice(-30);
  const max = Math.max(...entries.map(e => e[1]), 1);
  const barW = Math.max(10, Math.floor(600 / entries.length) - 2);
  const bars = entries.map(([day, count]) => {
    const h = Math.max(3, Math.round(count / max * 50));
    return `<title>${esc(day)}: ${count}</title><rect x="0" y="${50-h}" width="${barW}" height="${h}" rx="2" fill="var(--accent)" opacity=".8"/>`;
  }).join('');
  const total = barW + 2;
  return `<svg viewBox="0 0 ${entries.length * total} 60" style="width:100%;height:60px;overflow:visible">
    ${entries.map(([d,c],i) => `<g transform="translate(${i*total},0)">${bars.split('</rect>')[i] ? '<rect x="0" y="'+`${50-Math.max(3,Math.round(c/max*50))}`+'" width="'+barW+'" height="'+`${Math.max(3,Math.round(c/max*50))}`+'" rx="2" fill="var(--accent)" opacity=".8"><title>'+esc(d)+': '+c+'</title></rect>' : ''}</g>`).join('')}
  </svg>`;
  // simpler rewrite:
}

// ─────────────────────────────────────────────
// Run detail
// ─────────────────────────────────────────────
async function openRun(runId) {
  currentRunId = runId;
  closeWs();

  // Update sidebar highlight
  document.querySelectorAll('.run-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick')?.includes(runId));
  });

  document.getElementById('topbar-title').textContent = 'Loading…';
  document.getElementById('topbar-badge').style.display = 'none';
  document.getElementById('content').innerHTML = '<div class="empty"><span class="spinner"></span></div>';

  try {
    const run = await api(`/api/runs/${encodeURIComponent(runId)}`);
    renderRunDetail(run);
    connectWs(runId);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty">Failed to load run: ${esc(e.message)}</div>`;
  }
}

function renderRunDetail(run) {
  const title = document.getElementById('topbar-title');
  const badge = document.getElementById('topbar-badge');
  title.textContent = run.goal || run.run_id || 'Run';
  badge.textContent = run.status || 'unknown';
  badge.className = 'badge ' + badgeClass(run.status);
  badge.style.display = '';

  const tasks = run.tasks || run.results || [];
  const metrics = run.metrics || {};
  const graph = run.dependency_graph || { nodes: [], edges: [] };
  const timeline = run.timeline || [];

  document.getElementById('content').innerHTML = `
    <div id="stats-bar">
      ${statCard('Tasks',    `${metrics.completed_tasks ?? 0}/${metrics.total_tasks ?? tasks.length}`, '')}
      ${statCard('Failed',   fmt.num(metrics.failed_tasks), '', metrics.failed_tasks ? '#ef4444' : '')}
      ${statCard('Duration', fmt.dur(metrics.total_duration_seconds), '')}
      ${statCard('Parallel', fmt.num(metrics.parallel_tasks), 'tasks')}
    </div>

    <div class="section" style="padding:0">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab(event,'tab-tasks')">Tasks</button>
        <button class="tab-btn" onclick="switchTab(event,'tab-graph')">Dependency Graph</button>
        <button class="tab-btn" onclick="switchTab(event,'tab-timeline')">Timeline</button>
        <button class="tab-btn" onclick="switchTab(event,'tab-raw')">Raw JSON</button>
      </div>

      <div id="tab-tasks" class="tab-panel active" style="padding:14px">
        ${renderTaskList(tasks)}
      </div>
      <div id="tab-graph" class="tab-panel" style="padding:14px">
        ${renderDepGraph(graph)}
      </div>
      <div id="tab-timeline" class="tab-panel" style="padding:14px">
        ${renderTimeline(timeline)}
      </div>
      <div id="tab-raw" class="tab-panel" style="padding:14px">
        <pre style="font-size:10px;color:var(--muted);overflow:auto;max-height:400px">${esc(JSON.stringify(run, null, 2))}</pre>
      </div>
    </div>`;
}

function switchTab(e, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  const panel = document.getElementById(id);
  if (panel) panel.classList.add('active');
}

function renderTaskList(tasks) {
  if (!tasks.length) return '<div class="empty">No tasks</div>';
  return tasks.map(t => {
    const [icon, cls] = taskIcon(t);
    const deps = (t.depends_on || []).join(', ');
    return `<div class="task-row">
      <div class="task-icon ${cls}">${icon}</div>
      <div class="task-body">
        <div class="task-id">${esc(t.id || '')}</div>
        <div class="task-desc">${esc(t.description || '')}</div>
        <div class="task-meta">
          ${t.duration_seconds != null ? `<span>${fmt.dur(t.duration_seconds)}</span>` : ''}
          ${t.agent_model ? `<span>${esc(t.agent_model)}</span>` : ''}
          ${t.error        ? `<span style="color:var(--error)">${esc(String(t.error).slice(0,80))}</span>` : ''}
        </div>
        ${deps ? `<div class="task-deps">depends on: ${esc(deps)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderDepGraph(graph) {
  const { nodes, edges } = graph;
  if (!nodes.length) return '<div class="empty">No dependency data</div>';

  // Simple layered layout
  const layers = {};
  nodes.forEach(n => {
    const l = n.layer ?? 0;
    if (!layers[l]) layers[l] = [];
    layers[l].push(n);
  });

  const nodeW = 160, nodeH = 36, hGap = 24, vGap = 36;
  const layerNums = Object.keys(layers).map(Number).sort((a,b) => a-b);
  const maxPerLayer = Math.max(...layerNums.map(l => layers[l].length));
  const svgW = layerNums.length * (nodeW + hGap) + hGap;
  const svgH = maxPerLayer * (nodeH + vGap) + vGap;

  const positions = {};
  layerNums.forEach((l, li) => {
    const lNodes = layers[l];
    lNodes.forEach((n, ni) => {
      const x = hGap + li * (nodeW + hGap);
      const totalH = lNodes.length * (nodeH + vGap) - vGap;
      const startY = (svgH - totalH) / 2;
      const y = startY + ni * (nodeH + vGap);
      positions[n.id] = { x, y, cx: x + nodeW/2, cy: y + nodeH/2 };
    });
  });

  const statusColors = {
    completed: '#14532d', error: '#450a0a', running: '#1e3a5f', pending: '#1a1d27'
  };
  const statusStroke = {
    completed: '#22c55e', error: '#ef4444', running: '#3b82f6', pending: '#2a2d3a'
  };

  const edgeSvg = edges.map(e => {
    const from = positions[e.from], to = positions[e.to];
    if (!from || !to) return '';
    const x1 = from.x + nodeW, y1 = from.cy;
    const x2 = to.x, y2 = to.cy;
    const mx = (x1 + x2) / 2;
    return `<path class="edge-line" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="var(--border)"/>`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const p = positions[n.id];
    if (!p) return '';
    const fill   = statusColors[n.status] || statusColors.pending;
    const stroke = statusStroke[n.status] || statusStroke.pending;
    const label  = (n.label || n.id).slice(0, 22);
    return `<g>
      <rect class="node-rect" x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}"
            fill="${fill}" stroke="${stroke}"/>
      <text class="node-text" x="${p.cx}" y="${p.cy - 5}" text-anchor="middle">${esc(label)}</text>
      <text class="node-text" x="${p.cx}" y="${p.cy + 9}" text-anchor="middle" opacity=".6" font-size="9">${esc(n.status)}</text>
    </g>`;
  }).join('');

  return `<div id="graph-canvas" style="overflow-x:auto">
    <svg width="${svgW}" height="${svgH}" style="min-height:100px">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--border)"/>
        </marker>
      </defs>
      ${edgeSvg}
      ${nodeSvg}
    </svg>
  </div>`;
}

function renderTimeline(events) {
  if (!events.length) return '<div class="empty">No timeline data</div>';
  return events.map(e => `
    <div class="timeline-row">
      <span class="timeline-time">${fmt.ts(e.time).split(',')[1]?.trim() ?? fmt.ts(e.time)}</span>
      <span class="timeline-type">
        <span class="badge ${e.type === 'start' ? 'badge-running' : 'badge-success'}">${esc(e.type)}</span>
      </span>
      <span class="timeline-label">${esc(e.task_id || '')} ${esc(e.description ? '— ' + e.description.slice(0,60) : '')}</span>
    </div>`).join('');
}

// ─────────────────────────────────────────────
// WebSocket live updates
// ─────────────────────────────────────────────
function connectWs(runId) {
  closeWs();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  try {
    ws = new WebSocket(`${proto}://${location.host}/api/runs/${encodeURIComponent(runId)}/stream`);
    ws.onopen  = () => document.getElementById('live-dot').classList.add('connected');
    ws.onclose = () => document.getElementById('live-dot').classList.remove('connected');
    ws.onerror = () => document.getElementById('live-dot').classList.remove('connected');
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status_update' && msg.data && runId === currentRunId) {
          renderRunDetail(msg.data);
          renderRunList(allRuns); // refresh progress bars
        }
      } catch {}
    };
  } catch {}
}

function closeWs() {
  document.getElementById('live-dot').classList.remove('connected');
  if (ws) { try { ws.close(); } catch {} ws = null; }
}

// ─────────────────────────────────────────────
// Day chart helper (cleaner rewrite)
// ─────────────────────────────────────────────
// Replace the messy renderDayChart above with a clean SVG bar chart
(function patchDayChart() {
  window.renderDayChart = function(days) {
    if (!days || !Object.keys(days).length) return '<div class="empty">No activity data</div>';
    const entries = Object.entries(days).sort((a,b) => a[0] < b[0] ? -1 : 1).slice(-30);
    const max = Math.max(...entries.map(e => e[1]), 1);
    const bw = 16, bh = 50, gap = 4;
    const total = entries.length * (bw + gap);
    const bars = entries.map(([day, count], i) => {
      const h = Math.max(2, Math.round(count / max * bh));
      const x = i * (bw + gap);
      return `<rect x="${x}" y="${bh - h}" width="${bw}" height="${h}" rx="2" fill="var(--accent)" opacity=".8"><title>${esc(day)}: ${count}</title></rect>`;
    }).join('');
    return `<svg viewBox="0 0 ${total} ${bh+14}" style="width:100%;height:70px">
      ${bars}
      <text x="${total/2}" y="${bh+12}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(entries[0]?.[0]||'')} – ${esc(entries[entries.length-1]?.[0]||'')}</text>
    </svg>`;
  };
})();

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
loadRuns();
// Sidebar logo click → overview
document.querySelector('.logo').addEventListener('click', showOverview);
</script>
