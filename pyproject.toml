[project]
name = "polyphony-agent"
version = "0.1.0"
description = "A recursive agent structure for task planning and execution."
authors = [
    { name = "Matt", email = "mtmattqq@gmail.com" }
]
dependencies = [
    "pydantic>=2.0",
    "rich>=14.0",
    "pytest>=9.0.2",
]
requires-python = ">=3.14"

[project.scripts]
polyphony = "polyphony.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
